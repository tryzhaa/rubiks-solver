<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden prototype v3 (THROWAWAY)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#8fc8ff}
  canvas{display:block}
  .pill{position:fixed;background:rgba(255,255,255,.9);border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.15);color:#3a3a7a;font-weight:600;font-size:14px}

  #hint{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;white-space:nowrap}

  #bar{bottom:14px;right:14px;display:flex;gap:6px}
  #bar button{border:0;background:#ffd23f;border-radius:12px;padding:8px 12px;font-weight:700;color:#5a4300;cursor:pointer}
  #tag{top:14px;right:14px;font-size:12px;background:#ffd23f;color:#5a4300}
</style></head><body>
<div class="pill" id="top">Yellow cross: L-shape &nbsp; <span class="chip">F R U R' U' F'</span></div>
<div class="pill" id="tag">THROWAWAY PROTOTYPE v3</div>
<div class="pill" id="toast"></div>
<div class="pill" id="hint"><span class="chip">Drag</span> look around <span class="chip">Click</span> watering can, signpost or a butterfly</div>
<div class="pill" id="bar"><button id="play">⏸</button><button id="mute">🔊</button><button>Simple view</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
const C=(h)=>new THREE.Color(h).convertSRGBToLinear();
const rnd=(a,b)=>a+Math.random()*(b-a);
const scene=new THREE.Scene();
const HORIZON=C(0xd4ecff);
scene.fog=new THREE.Fog(HORIZON,30,80);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,300);cam.position.set(9,2.0,13);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.NoToneMapping;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.target.set(0,3.2,0);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.5;ctl.minDistance=4;ctl.maxDistance=22;
scene.add(new THREE.HemisphereLight(C(0xbfe0ff),C(0x6fbf4a),.85));
const sun=new THREE.DirectionalLight(C(0xfff0cf),1.3);sun.position.set(9,16,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:1,far:50});sun.shadow.bias=-.0004;scene.add(sun);
// sky
const skyMesh=new THREE.Mesh(new THREE.SphereGeometry(150,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
 uniforms:{top:{value:C(0x2a82ea)},hor:{value:HORIZON},sunDir:{value:sun.position.clone().normalize()}},
 vertexShader:'varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top,hor,sunDir;varying vec3 v;void main(){float h=clamp(v.y,0.,1.);vec3 c=mix(hor,top,pow(h,.5));float s=max(dot(v,sunDir),0.);c+=vec3(1.,.9,.6)*(pow(s,600.)*3.+pow(s,8.)*.25);gl_FragColor=vec4(c,1.);}'}));scene.add(skyMesh);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:C(c),roughness:.8,metalness:0},o));
function mesh(g,m,x=0,y=0,z=0,cast=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
const ground=mesh(new THREE.CircleGeometry(70,48),mat(0x3fae35,{roughness:1}),0,0,0,false);ground.rotation.x=-Math.PI/2;
for(let i=0;i<22;i++){const a=i/22*6.283+rnd(-.1,.1),d=rnd(48,62),s=rnd(10,20);
 const h=mesh(new THREE.IcosahedronGeometry(s,1),mat(i%2?0x3f9a3a:0x57b349,{flatShading:true,roughness:1}),Math.cos(a)*d,-s*.45,Math.sin(a)*d,false);h.scale.y=.6}
// wind
const uTime={value:0};
function sway(m,amp){m.onBeforeCompile=s=>{s.uniforms.uTime=uTime;
 s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform float uTime;')
 .replace('#include <project_vertex>',`
  vec4 mvPosition=instanceMatrix*vec4(transformed,1.0);
  float h=max(mvPosition.y,0.0);
  float ph=(instanceMatrix[3].x*.75+instanceMatrix[3].z*.35)*.2-uTime*2.1;
  float gust=.6+.4*sin(ph*.3+uTime*.35);
  float k=${amp}*h*h*gust;
  mvPosition.x+=(sin(ph)*.75+sin(ph*2.3+1.)*.25)*k+k*.7;
  mvPosition.z+=cos(ph*.7)*k*.35+k*.15;
  mvPosition=modelViewMatrix*mvPosition;
  gl_Position=projectionMatrix*mvPosition;`)}}
const D=new THREE.Object3D(),col=new THREE.Color();
// grass
{const g=new THREE.PlaneGeometry(.07,1,1,3);g.translate(0,.5,0);
 const p=g.attributes.position,cols=[];for(let i=0;i<p.count;i++){const y=p.getY(i);p.setX(i,p.getX(i)*(1-y*.9));const t=.45+y*.55;cols.push(t,t,t)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
 const m=mat(0xffffff,{vertexColors:true,side:THREE.DoubleSide,roughness:.9});sway(m,'.3');
 const N=24000,im=new THREE.InstancedMesh(g,m,N);im.receiveShadow=true;
 for(let i=0;i<N;i++){const a=rnd(0,6.283),d=Math.sqrt(Math.random())*30;
  D.position.set(Math.cos(a)*d,0,Math.sin(a)*d);D.rotation.set(rnd(-.15,.15),rnd(0,6.28),rnd(-.15,.15));D.scale.set(1,rnd(.3,.9),1);D.updateMatrix();im.setMatrixAt(i,D.matrix);
  col.setHSL(rnd(.24,.33),rnd(.55,.75),rnd(.3,.42));im.setColorAt(i,col)}
 scene.add(im)}
// flowers
const stemG=new THREE.CylinderGeometry(.012,.024,1,5);stemG.translate(0,.5,0);
const stemM=mat(0x2f9a33);sway(stemM,'.1');
function petals(n,sx,sy,sz,off,tilt){const a=[];for(let i=0;i<n;i++){const g=new THREE.SphereGeometry(.5,6,4);g.scale(sx,sy,sz);g.translate(0,0,off);g.rotateX(tilt);g.rotateY(i/n*6.283);a.push(g)}return THREE.BufferGeometryUtils.mergeBufferGeometries(a)}
function bundle(parts){return THREE.BufferGeometryUtils.mergeBufferGeometries(parts)}
const types=[
 {n:650,h:[.8,1.9],scale:[.8,1.4],head:()=>{const g=petals(8,.26,.05,.55,.3,-.25);g.scale(.36,.36,.36);return g},
  mid:()=>{const g=new THREE.SphereGeometry(.075,8,6);g.scale(1,.7,1);g.translate(0,.02,0);return g},midC:0xc7740a,
  pal:[0xee6fa0,0xefa04c,0xf0d263,0x7090ee,0x9d7edc,0xe5676f,0xffffff]},
 {n:280,h:[1.0,2.2],scale:[.8,1.2],head:()=>{const a=[];for(let i=0;i<16;i++){const y=-.5+i*.045,rr=.06-i*.002;const g=new THREE.SphereGeometry(.055,5,4);g.translate(Math.cos(i*2.4)*.03,y,Math.sin(i*2.4)*.03);g.scale(rr*18,1,rr*18);a.push(g)}return bundle(a)},
  mid:null,pal:[0x8a6ad8,0x6c84dc,0xb070d4,0xe07eac]},
 {n:45,h:[1.7,2.5],scale:[.9,1.3],head:()=>{const g=petals(13,.17,.04,.5,.34,-.18);g.scale(.62,.62,.62);return g},
  mid:()=>{const g=new THREE.SphereGeometry(.16,10,8);g.scale(1,.55,1);g.translate(0,.02,0);return g},midC:0x5a3010,pal:[0xf0c030,0xe8b030]},
 {n:130,h:[.5,1.1],scale:[.9,1.3],head:()=>{const a=[];const pts=[[0,0,0],[.11,.04,.03],[-.1,.05,.04],[.02,.06,-.11],[.04,.1,.09],[-.07,.1,-.06],[0,.15,0]];
   pts.forEach(p=>{const g=new THREE.SphereGeometry(.1,6,4);g.translate(...p);a.push(g)});return bundle(a)},mid:null,
  pal:[0xe87cb2,0xc67cd8,0xee8a72]}
];
const flowerMats=[];
types.forEach((T,ti)=>{
 const N=T.n,st=new THREE.InstancedMesh(stemG,stemM,N),headG=T.head();
 const hm=mat(0xffffff,{side:THREE.DoubleSide,roughness:.55});sway(hm,'.1');
 const hd=new THREE.InstancedMesh(headG,hm,N);let md=null;
 if(T.mid){const mm=mat(T.midC);sway(mm,'.1');md=new THREE.InstancedMesh(T.mid(),mm,N)}
 [st,hd,md].forEach(o=>{if(o){o.receiveShadow=true;scene.add(o)}});
 for(let i=0;i<N;i++){const a=rnd(0,6.283),d=Math.pow(Math.random(),.65)*27;const x=Math.cos(a)*d,z=Math.sin(a)*d;
  const H=rnd(T.h[0],T.h[1]);
  D.position.set(x,0,z);D.rotation.set(0,0,0);D.scale.set(1,H,1);D.updateMatrix();st.setMatrixAt(i,D.matrix);
  const pl=T.pal.length,patch=Math.min(pl-1,Math.max(0,Math.floor((Math.sin(x*.2+ti*3)+Math.cos(z*.17+ti)+Math.sin((x+z)*.1)+3)*pl/6)));
  const ci=Math.random()<.78?patch:Math.floor(Math.random()*pl);
  D.position.set(x,H,z);D.rotation.set(ti==1?0:rnd(-.5,.5),rnd(0,6.28),ti==1?0:rnd(-.5,.5));D.scale.setScalar(rnd(...T.scale));D.updateMatrix();
  hd.setMatrixAt(i,D.matrix);hd.setColorAt(i,C(T.pal[ci]));if(md)md.setMatrixAt(i,D.matrix)}
});
// trees
function tree(x,z,s){mesh(new THREE.CylinderGeometry(.2*s,.3*s,2*s,7),mat(0x6e4a2a),x,1*s,z);
 [[0,2.8,0,1.6,0x2f9e48],[.6,3.6,.2,1.2,0x3fb55a],[-.5,3.4,-.3,1.25,0x278a3f]].forEach(([a,b,c,d,e])=>mesh(new THREE.IcosahedronGeometry(d*s,1),mat(e,{flatShading:true}),x+a*s,b*s,z+c*s))}
[[-14,-11,1.7],[15,-12,2],[-17,6,1.5],[16,9,1.7],[-6,-19,1.9],[8,-20,1.6],[1,-24,2.2],[-24,-3,1.8],[24,-2,1.9]].forEach(t=>tree(...t));
// clouds
const clouds=[];for(let i=0;i<14;i++){const g=new THREE.Group();
 for(let j=0;j<8;j++){const low=j<3;const b=new THREE.Mesh(new THREE.SphereGeometry(rnd(3,5.5),10,8),new THREE.MeshBasicMaterial({color:low?0xdfe9f7:0xffffff,fog:false}));b.position.set(j*3.6-12,low?-1.2:rnd(0,1.8),rnd(-2,2));b.scale.y=.6;g.add(b)}
 g.position.set(rnd(-90,90),rnd(26,44),rnd(-95,-25));g.scale.setScalar(rnd(.9,1.6));scene.add(g);clouds.push(g)}
// props
function sub(p,g,c,x,y,z,rz=0,o={}){const m=new THREE.Mesh(g,mat(c,o));m.position.set(x,y,z);m.rotation.z=rz;m.castShadow=true;m.receiveShadow=true;p.add(m);return m}
const can=new THREE.Group();scene.add(can);can.position.set(-4.6,0,3.4);can.rotation.y=.6;can.scale.setScalar(1.2);
sub(can,new THREE.CylinderGeometry(.6,.6,.8,16),0x2f93e8,0,.4,0,0,{metalness:.5,roughness:.35});
sub(can,new THREE.CylinderGeometry(.07,.12,.95,8),0x1f78c5,.8,.65,0,-.9,{metalness:.5,roughness:.35});
sub(can,new THREE.TorusGeometry(.38,.05,8,16,Math.PI),0x1f78c5,0,.85,0,0,{metalness:.5,roughness:.35});
can.userData.msg='Watering can: start scanning your cube (camera opens here)';
const sign=new THREE.Group();scene.add(sign);sign.position.set(5.2,0,2.6);sign.rotation.y=-.7;
sub(sign,new THREE.BoxGeometry(.2,2.4,.2),0x7a5230,0,1.2,0);
sub(sign,new THREE.BoxGeometry(1.5,.45,.1),0xe3b873,.2,2.0,.12);sub(sign,new THREE.BoxGeometry(1.5,.45,.1),0xe3b873,-.2,1.4,.12);
sign.userData.msg='Signpost: technique guide and My solves (two tabs)';
// butterflies with painted wings
function wingTex(kind){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
 const up=()=>{x.beginPath();x.moveTo(0,50);x.bezierCurveTo(30,0,110,5,122,30);x.bezierCurveTo(126,55,70,62,0,62);x.closePath()};
 const lo=()=>{x.beginPath();x.moveTo(0,62);x.bezierCurveTo(60,64,100,80,92,104);x.bezierCurveTo(80,126,30,118,0,92);x.closePath()};
 const base={monarch:'#ff7a00',admiral:'#17171c',swallow:'#ffd400',blue:'#2f7bff'}[kind];
 [up,lo].forEach(p=>{p();x.fillStyle=base;x.fill();
  x.save();p();x.clip();
  if(kind=='admiral'){x.fillStyle='#ff2d1a';x.fillRect(40,20,30,100)}
  if(kind=='swallow'){x.fillStyle='#111';for(let i=0;i<4;i++)x.fillRect(20+i*24,0,8,128)}
  if(kind=='monarch'||kind=='blue'){x.strokeStyle='#111';x.lineWidth=2;for(let i=0;i<5;i++){x.beginPath();x.moveTo(0,60);x.lineTo(125,10+i*28);x.stroke()}}
  x.restore();p();x.strokeStyle='#111';x.lineWidth=6;x.stroke();
  if(kind=='monarch'||kind=='admiral'){x.fillStyle='#fff';for(let i=0;i<7;i++){x.beginPath();x.arc(30+i*14,i<4?18+Math.abs(i-2)*3:112-i*2,2.6,0,6.3);x.fill()}}});
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
const kinds=['monarch','monarch','admiral','swallow','blue'];const texs={};kinds.forEach(k=>texs[k]=wingTex(k));
const wingG=new THREE.PlaneGeometry(.6,.6);wingG.rotateX(-Math.PI/2);wingG.translate(.3,0,0);
const bfs=[];for(let i=0;i<7;i++){const g=new THREE.Group(),inner=new THREE.Group();g.add(inner);
 const m=new THREE.MeshBasicMaterial({map:texs[kinds[i%kinds.length]],transparent:true,alphaTest:.4,side:THREE.DoubleSide,fog:false});
 const mk=(s)=>{const piv=new THREE.Group();const w=new THREE.Mesh(wingG,m);piv.add(w);piv.scale.x=s;inner.add(piv);return piv};
 const R=mk(1),L=mk(-1);const body=new THREE.Mesh(new THREE.CylinderGeometry(.025,.02,.32,5),new THREE.MeshBasicMaterial({color:0x111111}));body.rotation.x=Math.PI/2;inner.add(body);
 const sc=i==0?1.9:rnd(.65,1.2);g.scale.setScalar(sc);
 g.userData={R,L,msg:'Butterfly: hint. It lands on the next piece to move',cx:rnd(-12,12),cz:rnd(-12,12),rx:rnd(2,8),rz:rnd(2,8),w:rnd(.12,.4)*(Math.random()<.5?-1:1),ph:rnd(0,6.28),h:rnd(.8,5),ha:rnd(.3,1),fl:rnd(14,20)};
 scene.add(g);bfs.push(g)}
const P=(u,t)=>{const a=t*u.w+u.ph;return new THREE.Vector3(u.cx+Math.cos(a)*u.rx+Math.sin(t*.7+u.ph)*1.2,u.h+Math.sin(t*.5+u.ph)*u.ha+Math.sin(t*3+u.ph)*.12,u.cz+Math.sin(a*1.3)*u.rz)};
// cube
const cube=new THREE.Group();scene.add(cube);cube.position.set(0,4.4,0);cube.scale.setScalar(1.2);
// reflections for glossy plastic
const envScene=new THREE.Scene();envScene.add(skyMesh.clone());
const envTex=new THREE.PMREMGenerator(r).fromScene(envScene).texture;
const gloss=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:C(c),roughness:.18,metalness:0,clearcoat:1,clearcoatRoughness:.04},o));
function roundedBox(w,rad,seg){let g=new THREE.BoxGeometry(w,w,w,seg,seg,seg);g.deleteAttribute('normal');g.deleteAttribute('uv');g=THREE.BufferGeometryUtils.mergeVertices(g);
 const p=g.attributes.position,h=w/2-rad,v=new THREE.Vector3(),cl=new THREE.Vector3();
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);cl.set(Math.max(-h,Math.min(h,v.x)),Math.max(-h,Math.min(h,v.y)),Math.max(-h,Math.min(h,v.z)));
  v.sub(cl);if(v.lengthSq()>0)v.normalize().multiplyScalar(rad);p.setXYZ(i,cl.x+v.x,cl.y+v.y,cl.z+v.z)}
 g.computeVertexNormals();return g}
const bodyG=roundedBox(.97,.1,14);
const sh=new THREE.Shape(),s0=.39,rr=.09;sh.moveTo(-s0+rr,-s0);sh.lineTo(s0-rr,-s0);sh.quadraticCurveTo(s0,-s0,s0,-s0+rr);sh.lineTo(s0,s0-rr);sh.quadraticCurveTo(s0,s0,s0-rr,s0);sh.lineTo(-s0+rr,s0);sh.quadraticCurveTo(-s0,s0,-s0,s0-rr);sh.lineTo(-s0,-s0+rr);sh.quadraticCurveTo(-s0,-s0,-s0+rr,-s0);
const stG=new THREE.ExtrudeGeometry(sh,{depth:.03,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:2,curveSegments:8});stG.translate(0,0,.455);
const face=[0xff1f2d,0xff6a00,0xfafafa,0xffe000,0x00c853,0x0a55ff];
const faceM=face.map(c=>gloss(c));
const body=gloss(0x0a0a0a,{roughness:.3,clearcoat:.8});const cubies=[];
for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
 const c=new THREE.Group();c.position.set(x,y,z);
 const b=new THREE.Mesh(bodyG,body);b.castShadow=true;c.add(b);
 const st=(ci,rx,ry)=>{const s=new THREE.Mesh(stG,faceM[ci]);s.rotation.set(rx,ry,0);c.add(s)};
 if(x==1)st(0,0,Math.PI/2);if(x==-1)st(1,0,-Math.PI/2);
 if(y==1)st(2,-Math.PI/2,0);if(y==-1)st(3,Math.PI/2,0);
 if(z==1)st(4,0,0);if(z==-1)st(5,0,Math.PI);
 cube.add(c);cubies.push(c)}
cube.userData.msg='Cube: in the real app this plays the solve';
let move=null,paused=false;const axes=['x','y','z'];
function startMove(){const ax=axes[Math.floor(Math.random()*3)],l=Math.random()<.5?1:-1;
 const piv=new THREE.Group();cube.add(piv);const sel=cubies.filter(c=>Math.round(c.position[ax])===l);
 sel.forEach(c=>piv.attach(c));move={piv,ax,sel,t:0,dir:Math.random()<.5?1:-1}}
function stepMove(dt){if(!move){startMove();return}
 move.t+=dt/.55;const k=Math.min(move.t,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
 move.piv.rotation[move.ax]=move.dir*e*Math.PI/2;
 if(k>=1){move.sel.forEach(c=>{cube.attach(c);c.position.round();});cube.remove(move.piv);move=null}}
document.getElementById('play').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'⏸'};
document.getElementById('mute').onclick=e=>{e.target.textContent=e.target.textContent=='🔊'?'🔇':'🔊'};
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(),toast=document.getElementById('toast');let down=null,moved=false;
r.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];moved=false});
r.domElement.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)moved=true});
r.domElement.addEventListener('pointerup',e=>{down=null;if(moved)return;mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
 const hits=ray.intersectObjects([can,sign,cube,...bfs],true);
 if(hits.length){let o=hits[0].object;while(o&&!o.userData.msg)o=o.parent;if(o){toast.textContent=o.userData.msg;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',2600)}}});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;uTime.value=t;
 cube.position.y=4.4+Math.sin(t*1.1)*.2;if(!paused)stepMove(dt);
 bfs.forEach(b=>{const u=b.userData,p=P(u,t),q=P(u,t+.05);b.position.copy(p);b.rotation.y=Math.atan2(-(q.x-p.x),-(q.z-p.z));b.rotation.z=Math.sin(t*.8+u.ph)*.12;
  const f=.15+(Math.sin(t*u.fl+u.ph)*.5+.5)*1.05;u.R.rotation.z=f;u.L.rotation.z=f});
 clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>110)c.position.x=-110});
 ctl.update();r.render(scene,cam)})();
</script></body></html>
